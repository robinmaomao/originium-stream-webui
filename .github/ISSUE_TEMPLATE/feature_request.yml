name: Feature request
description: Suggest a capability for Originium Stream
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Host (Sunshine)
        - Client (Moonlight)
        - Discovery / pairing
        - Settings
        - Theme
        - Packaging / update
        - Other
