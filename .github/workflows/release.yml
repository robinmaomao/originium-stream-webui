name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm --filter @originium/desktop tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            Copy-Item -Destination artifacts
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/originium-stream.exe (Join-Path $stage 'Originium Stream.exe')
          Copy-Item -Path LICENSE, NOTICE, README.md, components.lock.json -Destination $stage
          Copy-Item -Recurse third_party_licenses $stage
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path artifacts "Originium-Stream-$version-portable-win64.zip")
          Get-FileHash artifacts/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content artifacts/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME --generate-notes @files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
